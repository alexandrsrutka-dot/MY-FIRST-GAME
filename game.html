<!DOCTYPE html>
<html>
<head>
    <title>Moje první hra</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #game {
            width: 100%;
            height: 400px;
            background: #222;
            position: relative;
            overflow: hidden;
        }

        #player {
            position: absolute;
            width: 50px;
            height: 50px;
            left: 50px;
            bottom: 20px;
            font-size: 35px;
        }

        #enemy {
            position: absolute;
            width: 50px;
            height: 50px;
            left: 200px;
            top: -50px;
            font-size: 35px;
        }

        button {
            font-size: 25px;
            margin: 10px;
            padding: 10px 20px;
        }

        #gameOver {
            display: none;
            font-size: 30px;
            color: red;
        }
    </style>
</head>

<body>

<h1>🚀 Moje první hra</h1>

<p>Skóre: <span id="score">0</span></p>

<div id="game">
    <div id="player">🚀</div>
    <div id="enemy">👾</div>
</div>

<button onclick="moveLeft()">⬅️</button>
<button onclick="moveRight()">➡️</button>

<div id="gameOver">
    💥 GAME OVER 💥
    <br>
    <button onclick="restartGame()">🔄 HRÁT ZNOVU</button>
</div>

<script>

let player = document.getElementById("player");
let enemy = document.getElementById("enemy");
let scoreText = document.getElementById("score");
let gameOverText = document.getElementById("gameOver");

let playerX = 50;
let enemyX = 200;
let enemyY = -50;
let score = 0;
let gameRunning = true;

function moveLeft() {
    if (!gameRunning) return;

    playerX -= 20;

    if (playerX < 0) {
        playerX = 0;
    }

    player.style.left = playerX + "px";
}

function moveRight() {
    if (!gameRunning) return;

    playerX += 20;

    if (playerX > window.innerWidth - 50) {
        playerX = window.innerWidth - 50;
    }

    player.style.left = playerX + "px";
}

function checkCollision() {

    if (
        enemyX < playerX + 50 &&
        enemyX + 50 > playerX &&
        enemyY + 50 > 330
    ) {
        gameRunning = false;
        gameOverText.style.display = "block";
    }
}

function gameLoop() {

    if (gameRunning) {

        enemyY += 4;
        enemy.style.top = enemyY + "px";

        checkCollision();

        if (enemyY > 400) {
            enemyY = -50;
            enemyX = Math.random() * (window.innerWidth - 50);

            enemy.style.left = enemyX + "px";

            score++;
            scoreText.textContent = score;
        }
    }

    requestAnimationFrame(gameLoop);
}

function restartGame() {

    playerX = 50;
    enemyY = -50;
    score = 0;
    gameRunning = true;

    scoreText.textContent = score;
    player.style.left = playerX + "px";
    enemy.style.top = enemyY + "px";

    gameOverText.style.display = "none";
}

gameLoop();

</script>

</body>
</html>
